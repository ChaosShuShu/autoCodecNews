# ============================================
# RSS 订阅 → 翻译 → 日报 配置文件
# ============================================

# RSS 订阅源列表
feeds:
#  - name: "FFmpeg Blog"
#    url: "https://ffmpeg.org/main.rss"
#    priority: 1

  - name: "Netflix Tech Blog"
    url: "https://netflixtechblog.com/feed"
    priority: 1

  - name: "AOM (AV1)"
    url: "https://aomedia.org/feed/"
    priority: 1

  - name: "Streaming Learning Center"
    url: "https://streaminglearningcenter.com/feed"
    priority: 2

  - name: "Bitmovin Blog"
    url: "https://bitmovin.com/blog/feed/"
    priority: 2

  - name: "Twitch Engineering"
    url: "https://blog.twitch.tv/en/engineering/feed"
    priority: 2

  - name: "Meta Engineering"
    url: "https://engineering.fb.com/feed/"
    priority: 2

  - name: "Google AI Blog"
    url: "https://ai.googleblog.com/feeds/posts/default"
    priority: 2

  - name: "Demuxed"
    url: "https://demuxed.com/feed"
    priority: 3

  - name: "Red5 Pro"
    url: "https://www.red5pro.com/blog/feed/"
    priority: 3

# 翻译引擎配置
llm:
  # 可选: openai / deepseek / qwen / ollama
  provider: "opencode-go"
  # 模型名:
  #   openai → gpt-4o-mini (推荐), gpt-4o
  #   deepseek → deepseek-chat
  #   qwen → qwen-turbo, qwen-plus
  #   ollama → llama3, qwen2 等本地模型
  model: "deepseek-v4-flash"
  # 可选：用 DeepSeek 更便宜
  # provider: "deepseek"
  # model: "deepseek-chat"

# 内容过滤
filter:
  # 最多处理几天内的文章（0=不限）
  max_days: 5
  # 主题关键词白名单（标题+摘要包含任一即视为相关，覆盖中英文）
  # 留空则不启用主题过滤
  keywords:
    # ── 编码标准 ──
    - H.264
    - H.265
    - HEVC
    - AV1
    - VP9
    - VVC
    - MPEG
    - AVC
    - EVC
    - LCEVC
    - AVS3
    - AVS2
    - xHE-AAC
    - USAC

    # ── 编码器实现 ──
    - x264
    - x265
    - libvpx
    - dav1d
    - rav1e
    - SVT-AV1
    - aomenc
    - NVENC
    - VAAPI
    - Vulkan
    - CUDA
    - QuickSync
    - AMF
    - MediaCodec

    # ── 编解码技术 ──
