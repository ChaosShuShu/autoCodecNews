# 输出配置
output:
  # 每日最大文章数
  max_articles_per_day: 20
  # 摘要字数（中文字符）
  summary_length: 200
  # 输出目录
  dir: "data"

# 内容提取配置
extraction:
  # 对于 HTML 类 feed 是否启用 trafilatura 提取正文
  # 设为 false 则只使用 feed 摘要
  enabled: true
  # 超时秒数
  timeout: 30
